<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ders Takip Sistemi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Başlık ve Yeni Sınıf Ekleme -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <h1 class="text-2xl font-bold text-slate-800">Sınıf Ders Takip Takibi</h1>
      <form id="addClassForm" class="flex gap-2">
        <input type="text" id="classNameInput" placeholder="Yeni Sınıf Adı (Örn: 9-A)" required class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition font-medium">Sınıf Ekle</button>
      </form>
    </div>

    <!-- Sınıflar Listesi Container -->
    <div id="classList" class="grid gap-6 md:grid-cols-2">
      <!-- Firestore'dan gelen veriler buraya yüklenecek -->
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyActPpb2TrOqKV4OwnxjJ36n33Xoh8ai0g",
      authDomain: "ahbaderskts.firebaseapp.com",
      projectId: "ahbaderskts",
      storageBucket: "ahbaderskts.firebasestorage.app",
      messagingSenderId: "813687362214",
      appId: "1:813687362214:web:d8f447b6eb579aacf4da67",
      measurementId: "G-6HQPQSTJBN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const classesRef = collection(db, "classes");

    // Canlı Veri Dinleme
    onSnapshot(classesRef, (snapshot) => {
      const classList = document.getElementById("classList");
      classList.innerHTML = "";

      snapshot.docs.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;
        
        const card = document.createElement("div");
        card.className = "bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4";
        card.innerHTML = `
          <div class="flex justify-between items-center border-b pb-3">
            <h2 class="text-xl font-bold text-slate-800">${data.name}</h2>
            <button onclick="deleteClass('${id}')" class="text-red-500 hover:text-red-700 text-sm font-medium">Sınıfı Sil</button>
          </div>
          <form onsubmit="updateClassProgress(event, '${id}')" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Anlatılan Konu</label>
              <input type="text" id="topic-${id}" value="${data.topic || ''}" placeholder="İşlenen konu..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Kalan Sayfa / Soru</label>
              <input type="text" id="page-${id}" value="${data.page || ''}" placeholder="Örn: s. 142 veya Soru 15" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Verilen Ödev</label>
              <textarea id="homework-${id}" placeholder="Ödev detayları..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 h-20">${data.homework || ''}</textarea>
            </div>
            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-2 rounded-lg text-sm transition font-medium">Kaydet / Güncelle</button>
          </form>
        `;
        classList.appendChild(card);
      });
    });

    // Yeni Sınıf Ekleme
    document.getElementById("addClassForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("classNameInput");
      const name = input.value.trim();
      if (!name) return;

      const docId = name.toLowerCase().replace(/\s+/g, '-');
      await setDoc(doc(db, "classes", docId), {
        name: name,
        topic: "",
        page: "",
        homework: "",
        updatedAt: serverTimestamp()
      });
      input.value = "";
    });

    // Ders Notlarını Güncelleme
    window.updateClassProgress = async (e, id) => {
      e.preventDefault();
      const topic = document.getElementById(`topic-${id}`).value;
      const page = document.getElementById(`page-${id}`).value;
      const homework = document.getElementById(`homework-${id}`).value;

      await updateDoc(doc(db, "classes", id), {
        topic,
        page,
        homework,
        updatedAt: serverTimestamp()
      });
      alert("Notlar güncellendi!");
    };

    // Sınıfı Silme
    window.deleteClass = async (id) => {
      if (confirm("Bu sınıfı ve tüm notlarını silmek istediğinize emin misiniz?")) {
        await deleteDoc(doc(db, "classes", id));
      }
    };
  </script>
</body>
</html>
