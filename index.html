<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Takip Sistemi - Yönetici Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- GİRİŞ EKRANI -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-slate-200">
            <div class="text-center mb-8">
                <div class="bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-md">
                    <i class="fas fa-lock text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">Yönetici Girişi</h2>
                <p class="text-slate-500 mt-2 text-sm">Ders takip sistemine erişmek için giriş yapın.</p>
            </div>
            
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-posta Adresi</label>
                    <div class="relative">
                        <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pl-10">
                        <i class="fas fa-envelope absolute left-3 top-3 text-slate-400"></i>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Şifre</label>
                    <div class="relative">
                        <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pl-10">
                        <i class="fas fa-key absolute left-3 top-3 text-slate-400"></i>
                    </div>
                </div>
                <div id="loginError" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100 text-center">
                    Hatalı e-posta veya şifre girdiniz.
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-sm flex justify-center items-center gap-2">
                    <span>Giriş Yap</span>
                </button>
            </form>
        </div>
    </div>

    <!-- ANA UYGULAMA EKRANI (Başlangıçta Gizli) -->
    <div id="mainApp" class="hidden max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-8 flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">Ders Takip Sistemi</h1>
                <p class="text-slate-500 mt-1 text-sm">Konu, sayfa ve ödev kayıtları</p>
            </div>
            <button id="logoutBtn" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-lg transition flex items-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Çıkış Yap
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Sol Panel: Formlar -->
            <div class="space-y-6">
                <!-- Sınıf Yönetimi Kartı -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2">Sınıf Yönetimi</h2>
                    <div class="flex gap-2">
                        <input type="text" id="newClassName" placeholder="Örn: 12-A" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="addClassBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition"><i class="fas fa-plus"></i></button>
                    </div>
                    <ul id="classList" class="mt-4 space-y-2 max-h-40 overflow-y-auto text-sm">
                        <!-- Sınıflar buraya yüklenecek -->
                    </ul>
                </div>

                <!-- Yeni Ders Kaydı Kartı -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2">Yeni Ders Notu Ekle</h2>
                    <form id="lessonForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Sınıf Seçin</label>
                            <select id="classSelect" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Sınıf Yükleniyor...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Anlatılan Konu</label>
                            <input type="text" id="topic" required placeholder="Örn: Polinomlar - Çarpana Ayırma" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Kalınan Sayfa</label>
                                <input type="text" id="pageNumber" placeholder="Örn: 125" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Tarih</label>
                                <input type="date" id="lessonDate" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Ödevlendirme</label>
                            <textarea id="homework" rows="2" placeholder="Örn: Soru Bankası Test 4 ve 5 çözülecek" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg transition shadow-sm">
                            Kaydı Kaydet
                        </button>
                    </form>
                </div>
            </div>

            <!-- Sağ Panel: Kayıtlar ve Program -->
            <div class="lg:col-span-2">
                
                <!-- Ders Programı Kartı -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-blue-200 mb-6 bg-blue-50/30">
                    <div class="flex justify-between items-center mb-4 border-b border-blue-100 pb-2">
                        <h2 class="text-xl font-semibold text-slate-700">
                            <i class="far fa-calendar-alt text-blue-600 mr-2"></i>Bugünün Ders Programı <span class="text-sm font-normal text-slate-500">(Ahmet Baş)</span>
                            <span id="todayName" class="text-blue-600 text-sm ml-2 font-normal"></span>
                        </h2>
                        <button id="refreshScheduleBtn" class="text-sm text-blue-600 hover:text-blue-800 transition flex items-center gap-1">
                            <i class="fas fa-sync-alt"></i> Yenile
                        </button>
                    </div>
                    <div id="todaySchedule" class="space-y-4">
                        <div class="text-center text-slate-500 py-4"><i class="fas fa-spinner fa-spin mr-2"></i>Program yükleniyor...</div>
                    </div>
                </div>

                <!-- Son Ders Kayıtları Kartı -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[500px]">
                    <div class="flex justify-between items-center mb-6 border-b pb-2">
                        <h2 class="text-xl font-semibold text-slate-700">Son Ders Kayıtları</h2>
                        <select id="filterClass" class="text-sm border rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="all">Tüm Sınıflar</option>
                        </select>
                    </div>
                    
                    <div id="logsContainer" class="space-y-4">
                        <div class="text-center text-slate-500 py-8">Kayıtlar yükleniyor...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // APP 2: DERS TAKİP SİSTEMİ YAPILANDIRMASI
        const firebaseConfig = {
            apiKey: "AIzaSyActPpb2TrOqKV4OwnxjJ36n33Xoh8ai0g",
            authDomain: "ahbaderskts.firebaseapp.com",
            projectId: "ahbaderskts",
            storageBucket: "ahbaderskts.firebasestorage.app",
            messagingSenderId: "813687362214",
            appId: "1:813687362214:web:d01dfee47affe151f4da67",
            measurementId: "G-NK49PPLC1L"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // APP 1: DERS PROGRAMI SİSTEMİ YAPILANDIRMASI (Okuma)
        const progConfig = {
            apiKey: "AIzaSyDVZEEuWX9HbvsXo7_kdkpOoPgOT5D0mjA",
            projectId: "ahbadersprogsystem"
        };
        const progApp = initializeApp(progConfig, "ProgApp");
        const progDb = getFirestore(progApp);

        // DOM Elementleri
        const loginScreen = document.getElementById('loginScreen');
        const mainApp = document.getElementById('mainApp');
        const loginError = document.getElementById('loginError');
        const loginForm = document.getElementById('loginForm');
        const logoutBtn = document.getElementById('logoutBtn');

        document.getElementById('lessonDate').valueAsDate = new Date();

        const gunler = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
        const bugun = gunler[new Date().getDay()];
        document.getElementById('todayName').innerText = `(${bugun})`;

        // AUTH
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                loadClasses();
                loadLogs();
                loadTodaySchedule();
            } else {
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Kontrol Ediliyor...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginForm.reset();
            } catch (error) {
                console.error("Giriş hatası:", error);
                loginError.textContent = "Hatalı e-posta veya şifre girdiniz.";
                loginError.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Giriş Yap</span>';
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });

        // SINIF YÖNETİMİ
        async function loadClasses() {
            const classList = document.getElementById('classList');
            const classSelect = document.getElementById('classSelect');
            const filterClass = document.getElementById('filterClass');

            classList.innerHTML = '<li class="text-slate-400 py-2">Yükleniyor...</li>';

            try {
                const q = query(collection(db, "siniflar"), orderBy("ad", "asc"));
                const querySnapshot = await getDocs(q);

                classList.innerHTML = '';
                classSelect.innerHTML = '<option value="">Sınıf Seçin...</option>';
                filterClass.innerHTML = '<option value="all">Tüm Sınıflar</option>';

                if (querySnapshot.empty) {
                    classList.innerHTML = '<li class="text-slate-400 text-xs py-1">Henüz sınıf eklenmedi.</li>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;

                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-200";
                    li.innerHTML = `
                        <span class="font-medium text-slate-700">${data.ad}</span>
                        <button onclick="deleteClass('${id}')" class="text-red-500 hover:text-red-700 text-xs"><i class="fas fa-trash"></i></button>
                    `;
                    classList.appendChild(li);

                    classSelect.innerHTML += `<option value="${data.ad}">${data.ad}</option>`;
                    filterClass.innerHTML += `<option value="${data.ad}">${data.ad}</option>`;
                });
            } catch (err) {
                console.error("Sınıflar yüklenirken hata:", err);
                classList.innerHTML = '<li class="text-red-500 text-xs py-1">Hata oluştu!</li>';
            }
        }

        document.getElementById('addClassBtn').addEventListener('click', async () => {
            const input = document.getElementById('newClassName');
            const className = input.value.trim();
            if (!className) return;

            try {
                await addDoc(collection(db, "siniflar"), {
                    ad: className,
                    createdAt: serverTimestamp()
                });
                input.value = '';
                loadClasses();
            } catch (err) {
                console.error("Sınıf ekleme hatası:", err);
            }
        });

        window.deleteClass = async (id) => {
            if (!confirm("Bu sınıfı silmek istediğinize emin misiniz?")) return;
            try {
                await deleteDoc(doc(db, "siniflar", id));
                loadClasses();
            } catch (err) {
                console.error("Silme hatası:", err);
            }
        };

        // DERS KAYITLARI
        document.getElementById('lessonForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const className = document.getElementById('classSelect').value;
            const topic = document.getElementById('topic').value.trim();
            const pageNumber = document.getElementById('pageNumber').value.trim();
            const lessonDate = document.getElementById('lessonDate').value;
            const homework = document.getElementById('homework').value.trim();

            if (!className) {
                alert("Lütfen bir sınıf seçin.");
                return;
            }

            try {
                await addDoc(collection(db, "ders_kayitlari"), {
                    className,
                    topic,
                    pageNumber,
                    lessonDate,
                    homework,
                    createdAt: serverTimestamp()
                });

                document.getElementById('topic').value = '';
                document.getElementById('pageNumber').value = '';
                document.getElementById('homework').value = '';
                
                loadLogs();
            } catch (err) {
                console.error("Ders kaydı hatası:", err);
            }
        });

        async function loadLogs() {
            const container = document.getElementById('logsContainer');
            const selectedFilter = document.getElementById('filterClass').value;

            container.innerHTML = '<div class="text-center text-slate-500 py-8"><i class="fas fa-spinner fa-spin mr-2"></i>Kayıtlar yükleniyor...</div>';

            try {
                let q = query(collection(db, "ders_kayitlari"), orderBy("createdAt", "desc"));
                
                if (selectedFilter !== 'all') {
                    q = query(collection(db, "ders_kayitlari"), where("className", "==", selectedFilter), orderBy("createdAt", "desc"));
                }

                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="text-center text-slate-400 py-8">Henüz kaydedilmiş bir ders bulunmuyor.</div>';
                    return;
                }

                container.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;

                    const card = document.createElement('div');
                    card.className = "p-4 rounded-lg border border-slate-200 bg-slate-50 relative hover:shadow-sm transition";
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">${data.className}</span>
                            <div class="flex items-center gap-3">
                                <span class="text-xs text-slate-400"><i class="far fa-calendar mr-1"></i>${data.lessonDate || ''}</span>
                                <button onclick="deleteLog('${id}')" class="text-red-400 hover:text-red-600 text-sm"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <h3 class="font-semibold text-slate-800 text-base mb-1">${data.topic}</h3>
                        ${data.pageNumber ? `<p class="text-xs text-slate-500 mb-2"><i class="fas fa-book-open mr-1"></i> Kalınan Sayfa: <strong class="text-slate-700">${data.pageNumber}</strong></p>` : ''}
                        ${data.homework ? `<div class="mt-2 text-xs bg-amber-50 border border-amber-200 text-amber-800 p-2 rounded"><i class="fas fa-pencil-alt mr-1"></i> <strong>Ödev:</strong> ${data.homework}</div>` : ''}
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Kayıt yükleme hatası:", err);
                container.innerHTML = '<div class="text-center text-red-500 py-8">Kayıtlar çekilirken bir hata oluştu!</div>';
            }
        }

        window.deleteLog = async (id) => {
            if (!confirm("Bu ders kaydını silmek istediğinize emin misiniz?")) return;
            try {
                await deleteDoc(doc(db, "ders_kayitlari", id));
                loadLogs();
            } catch (err) {
                console.error("Kayıt silme hatası:", err);
            }
        };

        document.getElementById('filterClass').addEventListener('change', loadLogs);

        // DERS PROGRAMI YÜKLEME (SADECE AHMET BAŞ)
        async function loadTodaySchedule() {
            const scheduleContainer = document.getElementById('todaySchedule');
            scheduleContainer.innerHTML = '<div class="text-center text-slate-500 py-4"><i class="fas fa-spinner fa-spin mr-2"></i>Program yükleniyor...</div>';

            try {
                const progQuery = query(collection(progDb, "ana_programlar"));
                const progSnap = await getDocs(progQuery);

                let todayLessons = [];

                if (!progSnap.empty) {
                    for (const mainDoc of progSnap.docs) {
                        const subColRef = collection(progDb, "ana_programlar", mainDoc.id, "ders_programi");
                        const subSnap = await getDocs(subColRef);
                        
                        subSnap.forEach(itemDoc => {
                            const lessonData = itemDoc.data();
                            
                            // Burada ogretmen isminde oluşabilecek küçük/büyük harf veya boşluk farklarını önlemek için güvenli kontrol yapıyoruz.
                            const ogretmenAdi = lessonData.ogretmen ? lessonData.ogretmen.trim() : "";
                            
                            // SADECE BUGÜNÜN ve AHMET BAŞ'IN DERSLERİNİ ÇEK
                            if (lessonData.gun === bugun && ogretmenAdi === "Ahmet Baş") {
                                todayLessons.push(lessonData);
                            }
                        });
                    }
                }

                if (todayLessons.length === 0) {
                    scheduleContainer.innerHTML = `<div class="text-center text-slate-400 py-4 text-sm"><i class="fas fa-info-circle mr-1"></i>${bugun} günü için sana ait bir ders bulunamadı.</div>`;
                    return;
                }

                todayLessons.sort((a, b) => (a.saatIndex || 0) - (b.saatIndex || 0));

                scheduleContainer.innerHTML = '';
                todayLessons.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = "flex items-center justify-between bg-white p-3 rounded-lg border border-blue-100 shadow-sm";
                    itemDiv.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">
                                ${item.saat || item.dersSaati || '#'}
                            </span>
                            <div>
                                <h4 class="font-semibold text-slate-800 text-sm">${item.sinif || item.sinifAd || 'Sınıf Belirtilmedi'}</h4>
                                <p class="text-xs text-slate-500">${item.ders || item.dersAdi || 'Ders'}</p>
                            </div>
                        </div>
                        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded"><i class="far fa-clock mr-1"></i>${item.saatAraligi || ''}</span>
                    `;
                    scheduleContainer.appendChild(itemDiv);
                });

            } catch (err) {
                console.error("Ders programı yükleme hatası:", err);
                scheduleContainer.innerHTML = '<div class="text-center text-red-500 py-4 text-sm">Ders programı alınamadı.</div>';
            }
        }

        document.getElementById('refreshScheduleBtn').addEventListener('click', loadTodaySchedule);
    </script>
</body>
</html>
